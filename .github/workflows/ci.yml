name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Run Python tests
        run: python -m pytest data/test_rule_engine.py data/test_sprint3_regression.py tests/test_api.py -q
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=optional
      - name: Ensure Linux Rollup native dependency
        working-directory: frontend
        shell: bash
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save --package-lock=false --include=optional \
            "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - name: Build frontend
        working-directory: frontend
        run: npm run build
